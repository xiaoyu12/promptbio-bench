[project]
name = "promptbio-bench"
version = "0.1.0"
description = "LLM-assisted evaluation framework for bioinformatics and data science tasks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LLM
    "langchain",
    "langchain-community",
    "langchain-openai",
    "openai",
    "python-dotenv",

    # Core data science
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pydantic",

    # Testing
    "pytest",

    # Bioinformatics Python
    "biopython",
    "pysam",
    "pybedtools",
    "pyBigWig",
    "anndata",
    "scanpy",
    "gffutils",
    "pyreadr",

    # Image / document
    "pillow",
    "pdf2image",
    "cairosvg",
    "openpyxl",
]

[tool.uv]
# Run the repository's scripts directly without building a Python package.
package = false

# Non-Python dependencies from environment.yml must be installed separately
# (e.g. with Conda); uv does not install these system tools or R packages:
#   poppler (pdf2image runtime dependency)
#   r-base, r-jsonlite, r-optparse, r-seurat, r-seuratdisk
#   bioconductor-singlecellexperiment, bioconductor-zellkonverter
#   samtools>=1.9, bcftools>=1.9, htslib>=1.9 (bgzip and tabix)
#   bedtools (pybedtools runtime dependency), bedops (sort-bed)
#   tree, perl, julia
